<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Распознавание Автономеров</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .result-box { margin-top: 20px; padding: 15px; background: #e7f3fe; border-left: 6px solid #2196F3; }
        img { max-width: 100%; border-radius: 4px; margin-top: 10px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Распознавание номера</h2>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Распознать</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if plate_number %}
            <div class="result-box">
                <h3>Распознанный номер: <span>{{ plate_number }}</span></h3>
                {% if image_url %}
                    <img src="{{ image_url }}" alt="Обработанный номер">
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
